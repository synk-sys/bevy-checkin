# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 1        # keep one warm during doors-open; set to 0 after the event
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase project (attendee data is stored in its Firestore database)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_EVENT_NAME
    value: "DevFest Toronto 2026"
    availability: [BUILD, RUNTIME]

  # Who may sign in: "Name:password,Name:password" (no commas in passwords). Set with:
  #   firebase apphosting:secrets:set admin-users
  #   firebase apphosting:secrets:set staff-users
  #   firebase apphosting:secrets:set session-secret   (any long random string)
  - variable: ADMIN_USERS
    secret: admin-users
    availability: [RUNTIME]
  - variable: STAFF_USERS
    secret: staff-users
    availability: [RUNTIME]
  - variable: SESSION_SECRET
    secret: session-secret
    availability: [RUNTIME]

  # Bevy API (create secrets with: firebase apphosting:secrets:set bevy-api-token)
  - variable: BEVY_API_BASE_URL
    value: "https://REPLACE_WITH_BEVY_API_HOST"
    availability: [RUNTIME]
  - variable: BEVY_EVENT_ID
    value: "REPLACE_ME"
    availability: [RUNTIME]
  - variable: BEVY_API_TOKEN
    secret: bevy-api-token
    availability: [RUNTIME]
  # - variable: BEVY_WEBHOOK_SECRET
  #   secret: bevy-webhook-secret
  #   availability: [RUNTIME]

  - variable: ALLOW_DEMO_DATA
    value: "false"
    availability: [RUNTIME]
