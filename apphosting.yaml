# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 1        # keep one warm during doors-open; set to 0 after the event
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase web config (public; Firestore is locked down by rules)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_ME.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_EVENT_NAME
    value: "DevFest Toronto 2026"
    availability: [BUILD, RUNTIME]

  # Who may sign in (Google accounts)
  - variable: ADMIN_EMAILS
    value: "lead@example.com"
    availability: [RUNTIME]
  - variable: STAFF_EMAILS
    value: "volunteer1@example.com,volunteer2@example.com"
    availability: [RUNTIME]
  # - variable: STAFF_DOMAINS        # e.g. everyone @yourgdg.org
  #   value: "yourgdg.org"
  #   availability: [RUNTIME]

  # Bevy API (create secrets with: firebase apphosting:secrets:set bevy-api-token)
  - variable: BEVY_API_BASE_URL
    value: "https://REPLACE_WITH_BEVY_API_HOST"
    availability: [RUNTIME]
  - variable: BEVY_EVENT_ID
    value: "REPLACE_ME"
    availability: [RUNTIME]
  - variable: BEVY_API_TOKEN
    secret: bevy-api-token
    availability: [RUNTIME]
  # - variable: BEVY_WEBHOOK_SECRET
  #   secret: bevy-webhook-secret
  #   availability: [RUNTIME]

  - variable: ALLOW_DEMO_DATA
    value: "false"
    availability: [RUNTIME]
